{% extends "blog/base.html" %}

{% block page_content %}

{% for post in posts %}
    <h2><a href="{% url 'blog_detail' post.slug %}">{{ post.title }}</a></h2>
    <p>{{post.created_on }}</p>
    <p>{{ post.body | slice:":150" }}.......</p>

    <p>
        Tags:
        {% for tag in post.tags.all %}
            <a href="{% url 'blog_tags' tag.slug %}">
                {{ tag.name }}
            </a>
            {% if not forloop.last %}, {% endif %}
        {% endfor %}
    </p>
{% endfor %}

{% endblock %}
